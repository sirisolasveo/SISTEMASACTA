<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguimiento de documento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-dark: #071a2e;
        --bg-mid: #0d2340;
        --panel: #0f273f;
        --line: rgba(146, 180, 255, 0.16);
        --blue: #4fa0ff;
        --blue-2: #67d9ff;
        --text: #edf5ff;
        --muted: #a7bfdc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(180deg, #020d1d 0%, #091a2d 100%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        max-width: 620px;
        width: 100%;
        background: rgba(11, 27, 46, 0.96);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px 22px;
        box-shadow: 0 18px 38px rgba(8, 18, 31, 0.48);
      }
      .eyebrow {
        color: var(--blue-2);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.68rem;
        font-weight: 700;
      }
      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.06em;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.7;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
      }
      .btn.primary {
        background: linear-gradient(135deg, var(--blue), #2f7cf6);
        color: white;
      }
      .btn.secondary {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid rgba(149, 182, 255, 0.18);
      }
      @media (max-width: 640px) {
        .card { padding: 22px 16px; }
        .actions { flex-direction: column; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Monitoreo</div>
      <h1>Seguimiento de documento</h1>
      <p>Consulta el estado del documento en cada etapa del flujo para mantener un control claro y eficiente.</p>
      <div class="actions">
        <a class="btn primary" href="#">Ver estado</a>
        <a class="btn secondary" href="index.html">Volver</a>
      </div>
    </div>
  </body>
</html>
